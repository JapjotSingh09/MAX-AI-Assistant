name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db
      RATE_LIMIT_AUTH_PER_MINUTE: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx next typegen
      - run: npm exec tsc -- --noEmit
      - run: npx vitest run tests/commands.test.ts tests/ai.test.ts
      - run: npx drizzle-kit push --force
      - run: npm run build
      - name: End-to-end API tests (data isolation, 401, 429, ...)
        run: |
          npx next start -p 3100 &
          sleep 6
          E2E_BASE_URL=http://localhost:3100 npx vitest run tests/e2e.test.ts

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      # Production secrets are NOT used here: the debug APK needs none.
      - name: Unit tests
        run: gradle -p android testDebugUnitTest
      - name: Build debug APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: max-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
